name: Price Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  repository_dispatch:
    types: [run-monitor]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # 관심종목 설정은 bashy.app 이 가지고 있다. 이 비밀은 그걸 '읽기만' 하는 통로다.
          ECON_SECRET: ${{ secrets.ECON_SECRET }}
        run: python3 price_watch.py monitor
      - name: Commit data
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main || true
            git reset -q --mixed FETCH_HEAD || true      # 방금 받은 원격 끝점 기준으로(추적 ref 문제 회피)
            # prices.json 은 더 이상 파일로 쓰지 않는다 (bashy.app → Firebase 로 간다)
            git add -A watch_state.json history.json
            if git diff --cached --quiet; then
              echo "변경 없음"; exit 0
            fi
            git commit -q -m "data update [skip ci]"
            if git push -q origin HEAD:main; then
              echo "푸시 완료"; exit 0
            fi
            echo "재시도 $i (원격이 먼저 바뀜)"; sleep 2
          done
          # 5번 다 실패하면 조용히 넘기지 않는다. 예전엔 continue-on-error + exit 0 이라
          # 데이터가 몇 시간씩 안 올라가도 워크플로는 계속 초록불이었다.
          echo "5회 시도 모두 실패 — 데이터가 올라가지 않았습니다"
          exit 1
