name: Price Monitor

on:
  # ── 왜 이렇게 잘게 나눴는가 ─────────────────────────────────────
  # 예전엔 바깥 크론이 1분마다 repository_dispatch 를 쏴서 하루 1,400회를 돌았다.
  # 새벽 3시에도, 주말에도 똑같이 돌았다. 그러다 2026-08-26 GitHub Actions 장애 때
  # 러너를 못 받은 run 이 전부 '실패 메일'로 돌아왔다. 코드는 멀쩡했는데
  # 돌린 횟수가 많다는 이유만으로 메일함이 터진 것이다.
  # 그래서 '움직이는 시간엔 촘촘히, 안 움직이는 시간엔 드물게' 로 바꿨다.
  # 시각은 전부 UTC 다. KST = UTC+9, ET = UTC-4(서머) / UTC-5(겨울).
  schedule:
    - cron: '*/5 0-6 * * 1-5'         # 한국장 09:00~16:00 KST
    - cron: '*/5 13-20 * * 1-5'       # 미국장 09:30~16:00 ET (서머·겨울 양쪽 포함)
    - cron: '*/30 7-12,21-23 * * 1-5' # 장 밖 — 코인/환율/장마감 알림용 최소 감시
    - cron: '*/30 * * * 0,6'          # 주말 — 코인과 환율은 쉬지 않는다
  workflow_dispatch: {}
  # repository_dispatch 는 뺐다.
  # 바깥에서 1분마다 두드리던 통로였는데, 그게 위에 적은 폭주의 원인이었다.
  # 급할 땐 Actions 탭의 'Run workflow' 로 손으로 돌린다.

permissions:
  contents: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # 관심종목 설정은 bashy.app 이 가지고 있다. 이 비밀은 그걸 '읽기만' 하는 통로다.
          ECON_SECRET: ${{ secrets.ECON_SECRET }}
        run: python3 price_watch.py monitor
      - name: Commit data
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main || true
            git reset -q --mixed FETCH_HEAD || true      # 방금 받은 원격 끝점 기준으로(추적 ref 문제 회피)
            # prices.json 은 더 이상 파일로 쓰지 않는다 (bashy.app → Firebase 로 간다)
            git add -A watch_state.json history.json
            if git diff --cached --quiet; then
              echo "변경 없음"; exit 0
            fi
            git commit -q -m "data update [skip ci]"
            if git push -q origin HEAD:main; then
              echo "푸시 완료"; exit 0
            fi
            echo "재시도 $i (원격이 먼저 바뀜)"; sleep 2
          done
          # 5번 다 실패하면 조용히 넘기지 않는다. 예전엔 continue-on-error + exit 0 이라
          # 데이터가 몇 시간씩 안 올라가도 워크플로는 계속 초록불이었다.
          echo "5회 시도 모두 실패 — 데이터가 올라가지 않았습니다"
          exit 1
